<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>職涯性向與工作價值觀測驗</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #e4e7ec;
      --primary: #3157d5;
      --primary-dark: #2445b5;
      --soft: #eef3ff;
      --danger: #b42318;
      --danger-bg: #fef3f2;
      --shadow: 0 12px 32px rgba(23, 32, 51, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #eef3ff 0, var(--bg) 240px);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .hero {
      margin-bottom: 18px;
      padding: 18px 4px 4px;
    }
    .hero h1 {
      margin: 0 0 6px;
      font-size: clamp(1.65rem, 4vw, 2.35rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(228, 231, 236, 0.85);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 34px);
    }

    .hidden { display: none !important; }

    .intro-grid {
      display: grid;
      gap: 20px;
    }
    .intro-note {
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--soft);
      color: #344054;
      font-size: 0.95rem;
    }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .field input {
      width: 100%;
      border: 1px solid #cfd4dc;
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: #fff;
    }
    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(49, 87, 213, 0.12);
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      transition: transform .05s ease, background .2s ease, opacity .2s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary {
      background: #f2f4f7;
      color: #344054;
    }
    .btn-secondary:hover { background: #e8ebf0; }
    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .quiz-top {
      position: sticky;
      top: 0;
      z-index: 10;
      margin-bottom: 16px;
      padding: 12px 0 8px;
      background: linear-gradient(180deg, rgba(245,247,251,.97) 78%, rgba(245,247,251,0));
      backdrop-filter: blur(4px);
    }
    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: #475467;
      font-size: .92rem;
      font-weight: 650;
    }
    .progress-track {
      height: 10px;
      background: #e9edf4;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #3157d5, #6384ef);
      border-radius: inherit;
      transition: width .25s ease;
    }

    .scale-legend {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: .78rem;
      text-align: center;
    }

    .question-list {
      display: grid;
      gap: 14px;
    }
    .question {
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 18px;
      background: #fff;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .question.unanswered {
      border-color: #fda29b;
      background: #fffafa;
      box-shadow: 0 0 0 3px rgba(240, 68, 56, .07);
    }
    .q-title {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 14px;
      font-weight: 700;
    }
    .q-id {
      flex: 0 0 auto;
      color: var(--primary);
      font-size: .82rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--soft);
      margin-top: 1px;
    }
    .q-text { flex: 1; }

    .likert {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }
    .option {
      position: relative;
    }
    .option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .option label {
      display: flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      border: 1px solid #d0d5dd;
      border-radius: 11px;
      background: #fff;
      color: #475467;
      font-weight: 750;
      user-select: none;
      transition: border-color .15s, background .15s, color .15s, transform .05s;
    }
    .option label:hover {
      border-color: #98a2b3;
      background: #f9fafb;
    }
    .option input:checked + label {
      border-color: var(--primary);
      background: var(--soft);
      color: var(--primary);
      box-shadow: inset 0 0 0 1px var(--primary);
    }
    .option input:focus-visible + label {
      outline: 3px solid rgba(49,87,213,.22);
      outline-offset: 2px;
    }

    .message {
      margin: 16px 0 0;
      border-radius: 12px;
      padding: 12px 14px;
      background: var(--danger-bg);
      color: var(--danger);
      font-weight: 650;
      display: none;
    }
    .message.show { display: block; }

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }
    .nav .btn { min-width: 118px; }

    .complete {
      text-align: center;
      padding: 16px 0 4px;
    }
    .complete h2 {
      margin: 0 0 12px;
      font-size: 1.8rem;
    }
    .complete p {
      margin: 0 auto 24px;
      max-width: 620px;
      color: var(--muted);
    }
    .complete-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    @media (max-width: 640px) {
      .app { width: min(100% - 18px, 920px); padding-top: 16px; }
      .hero { padding-inline: 4px; }
      .card { padding: 16px; border-radius: 15px; }
      .question { padding: 15px; }
      .q-title { gap: 8px; }
      .scale-legend { font-size: .70rem; gap: 2px; }
      .likert { gap: 6px; }
      .option label { min-height: 44px; border-radius: 10px; }
      .nav { position: sticky; bottom: 0; padding: 12px 0 4px; background: linear-gradient(0deg, rgba(255,255,255,.98) 76%, rgba(255,255,255,0)); }
      .nav .btn { flex: 1; min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>職涯性向與工作價值觀測驗</h1>
      <p>共 60 題，每題請選擇最符合你目前狀態的程度。</p>

        <div class="field">
          <label for="nameInput">姓名／暱稱</label>
          <input id="nameInput" type="text" maxlength="80" autocomplete="name" placeholder="請輸入姓名或暱稱" />
        </div>
        <button id="startBtn" class="btn btn-primary" type="button">開始測驗</button>
        <div id="introMessage" class="message" role="alert"></div>
      </div>
    </section>

    <section id="quizView" class="hidden">
      <div class="quiz-top">
        <div class="progress-row">
          <span id="pageText">第 1 / 10 頁</span>
          <span id="progressText">已完成 0 / 60</span>
        </div>
        <div class="progress-track" aria-label="作答進度">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <div class="card">
        <div class="scale-legend" aria-hidden="true">
          <span>1<br>非常不同意</span>
          <span>2<br>不同意</span>
          <span>3<br>普通／不確定</span>
          <span>4<br>同意</span>
          <span>5<br>非常同意</span>
        </div>
        <div id="questionList" class="question-list"></div>
        <div id="quizMessage" class="message" role="alert"></div>
        <div class="nav">
          <button id="prevBtn" class="btn btn-secondary" type="button">上一頁</button>
          <button id="nextBtn" class="btn btn-primary" type="button">下一頁</button>
        </div>
      </div>
    </section>

    <section id="completeView" class="card hidden">
      <div class="complete">
        <h2>測驗完成</h2>
        <p>請下載 JSON，並將 JSON 上傳至指定的 AI 職涯分析工具進行分析。</p>
        <div class="complete-actions">
          <button id="downloadBtn" class="btn btn-primary" type="button">下載作答 JSON</button>
          <button id="restartBtn" class="btn btn-secondary" type="button">重新開始</button>
        </div>
        <div id="completeMessage" class="message" role="alert"></div>
      </div>
    </section>
  </main>

      function toLocalISO(date = new Date()) {
        const pad = n => String(n).padStart(2, "0");
        const yyyy = date.getFullYear();
        const mm = pad(date.getMonth() + 1);
        const dd = pad(date.getDate());
        const hh = pad(date.getHours());
        const mi = pad(date.getMinutes());
        const ss = pad(date.getSeconds());
        const offset = -date.getTimezoneOffset();
        const sign = offset >= 0 ? "+" : "-";
        const abs = Math.abs(offset);
        const oh = pad(Math.floor(abs / 60));
        const om = pad(abs % 60);
        return `${yyyy}-${mm}-${dd}T${hh}:${mi}:${ss}${sign}${oh}:${om}`;
      }

      // Safari / iOS 在 file:// 本機 HTML 情境下，可能禁止 localStorage。
      // 所有儲存操作都必須安全失敗，不能讓測驗本身停止運作。
      let storageAvailable = true;

      function safeStorageGet(key) {
        if (!storageAvailable) return null;
        try {
          return window.localStorage.getItem(key);
        } catch (error) {
          storageAvailable = false;
          console.warn("localStorage unavailable; continuing without persistent storage.", error);
          return null;
        }
      }

      function safeStorageSet(key, value) {
        if (!storageAvailable) return false;
        try {
          window.localStorage.setItem(key, value);
          return true;
        } catch (error) {
          storageAvailable = false;
          console.warn("localStorage unavailable; continuing without persistent storage.", error);
          return false;
        }
      }

      function safeStorageRemove(key) {
        if (!storageAvailable) return false;
        try {
          window.localStorage.removeItem(key);
          return true;
        } catch (error) {
          storageAvailable = false;
          console.warn("localStorage unavailable; continuing without persistent storage.", error);
          return false;
        }
      }

      function loadState() {
        const raw = safeStorageGet(STORAGE_KEY);
        if (!raw) return;

        try {
          const saved = JSON.parse(raw);
          if (!saved || saved.questionnaire_version !== QUESTIONNAIRE_VERSION) {
            safeStorageRemove(STORAGE_KEY);
            return;
          }
          state = {
            ...state,
            ...saved,
            answers: saved.answers && typeof saved.answers === "object" ? saved.answers : {}
          };
        } catch (error) {
          console.warn("Saved state could not be read and was cleared.", error);
          safeStorageRemove(STORAGE_KEY);
        }
      }

      function saveState() {
        safeStorageSet(STORAGE_KEY, JSON.stringify(state));
      }

      function showOnly(screen) {
        introView.classList.toggle("hidden", screen !== "intro");
        quizView.classList.toggle("hidden", screen !== "quiz");
        completeView.classList.toggle("hidden", screen !== "complete");
        state.screen = screen;
        saveState();
      }

      function setMessage(el, text = "") {
        el.textContent = text;
        el.classList.toggle("show", Boolean(text));
      }

      function completedCount() {
        return QUESTIONS.reduce((count, q) => count + (Number.isInteger(Number(state.answers[q.id])) ? 1 : 0), 0);
      }

      function updateProgress() {
        const count = completedCount();
        const totalPages = Math.ceil(QUESTIONS.length / PAGE_SIZE);
        progressText.textContent = `已完成 ${count} / ${QUESTIONS.length}`;
        pageText.textContent = `第 ${state.current_page + 1} / ${totalPages} 頁`;
        progressBar.style.width = `${(count / QUESTIONS.length) * 100}%`;
      }

      function renderPage() {
        const totalPages = Math.ceil(QUESTIONS.length / PAGE_SIZE);
        state.current_page = Math.min(Math.max(0, state.current_page), totalPages - 1);
        const start = state.current_page * PAGE_SIZE;
        const pageQuestions = QUESTIONS.slice(start, start + PAGE_SIZE);
        questionList.innerHTML = "";

        pageQuestions.forEach(q => {
          const card = document.createElement("article");
          card.className = "question";
          card.dataset.questionId = q.id;

          const title = document.createElement("div");
          title.className = "q-title";
          title.innerHTML = `<span class="q-id">${q.id}</span><span class="q-text"></span>`;
          title.querySelector(".q-text").textContent = q.text;
          card.appendChild(title);

          const group = document.createElement("div");
          group.className = "likert";
          group.setAttribute("role", "radiogroup");
          group.setAttribute("aria-label", `${q.id} ${q.text}`);

          for (let score = 1; score <= 5; score++) {
            const wrap = document.createElement("div");
            wrap.className = "option";
            const inputId = `${q.id}_${score}`;
            const input = document.createElement("input");
            input.type = "radio";
            input.name = q.id;
            input.id = inputId;
            input.value = String(score);
            input.checked = Number(state.answers[q.id]) === score;
            input.addEventListener("change", () => {
              state.answers[q.id] = score;
              saveState();
              card.classList.remove("unanswered");
              setMessage(quizMessage, "");
              updateProgress();
            });

            const label = document.createElement("label");
            label.htmlFor = inputId;
            label.textContent = String(score);
            label.title = SCALE.labels[String(score)];

            wrap.appendChild(input);
            wrap.appendChild(label);
            group.appendChild(wrap);
          }

          card.appendChild(group);
          questionList.appendChild(card);
        });

        prevBtn.disabled = state.current_page === 0;
        nextBtn.textContent = state.current_page === totalPages - 1 ? "完成測驗" : "下一頁";
        updateProgress();
        saveState();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function getMissingQuestions() {
        return QUESTIONS.filter(q => !Number.isInteger(Number(state.answers[q.id])));
      }

      function validateAllAndGoComplete() {
        const missing = getMissingQuestions();
        if (missing.length > 0) {
          const first = missing[0];
          state.current_page = Math.floor(QUESTIONS.findIndex(q => q.id === first.id) / PAGE_SIZE);
          renderPage();
          setMessage(quizMessage, `還有 ${missing.length} 題尚未完成。`);
          requestAnimationFrame(() => {
            const firstCard = questionList.querySelector(`[data-question-id="${first.id}"]`);
            if (firstCard) {
              firstCard.classList.add("unanswered");
              firstCard.scrollIntoView({ behavior: "smooth", block: "center" });
            }
          });
          return false;
        }
        state.completed_at = toLocalISO(new Date());
        saveState();
        showOnly("complete");
        window.scrollTo({ top: 0, behavior: "smooth" });
        return true;
      }

      function buildExportObject() {
        return {
          schema_version: SCHEMA_VERSION,
          questionnaire_id: QUESTIONNAIRE_ID,
          questionnaire_version: QUESTIONNAIRE_VERSION,
          language: LANGUAGE,
          respondent: {
            name: state.name
          },
          started_at: state.started_at,
          completed_at: state.completed_at || toLocalISO(new Date()),
          scale: SCALE,
          answers: QUESTIONS.map(q => ({
            question_id: q.id,
            question_text: q.text,
            score: Number(state.answers[q.id])
          }))
        };
      }

      function sanitizeFilenamePart(value) {
        let safe = value
          .trim()
          .replace(/[<>:"/\\|?*\x00-\x1F]/g, "_")
          .replace(/\s+/g, "_")
          .replace(/^\.+|\.+$/g, "")
          .slice(0, 60);
        if (!safe) safe = "respondent";
        return safe;
      }

      function fileTimestamp(date = new Date()) {
        const pad = n => String(n).padStart(2, "0");
        return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
      }

      function downloadJSON() {
        const missing = getMissingQuestions();
        if (missing.length > 0) {
          showOnly("quiz");
          state.current_page = Math.floor(QUESTIONS.findIndex(q => q.id === missing[0].id) / PAGE_SIZE);
          renderPage();
          setMessage(quizMessage, `還有 ${missing.length} 題尚未完成。`);
          return;
        }

        if (!state.completed_at) {
          state.completed_at = toLocalISO(new Date());
          saveState();
        }

        const payload = buildExportObject();
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `career_test_${sanitizeFilenamePart(state.name)}_${fileTimestamp(new Date())}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        setMessage(completeMessage, "");
      }

      function restart() {
        safeStorageRemove(STORAGE_KEY);
        state = {
          questionnaire_version: QUESTIONNAIRE_VERSION,
          name: "",
          started_at: null,
          completed_at: null,
          answers: {},
          current_page: 0,
          screen: "intro"
        };
        nameInput.value = "";
        setMessage(introMessage, "");
        setMessage(quizMessage, "");
        setMessage(completeMessage, "");
        showOnly("intro");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      startBtn.addEventListener("click", () => {
        const name = nameInput.value.trim();
        if (!name) {
          setMessage(introMessage, "請先輸入姓名／暱稱。 ");
          nameInput.focus();
          return;
        }
        state.name = name;
        if (!state.started_at) state.started_at = toLocalISO(new Date());
        state.completed_at = null;
        state.screen = "quiz";
        saveState();
        setMessage(introMessage, "");
        showOnly("quiz");
        renderPage();
      });

      prevBtn.addEventListener("click", () => {
        if (state.current_page > 0) {
          state.current_page--;
          setMessage(quizMessage, "");
          renderPage();
        }
      });

      nextBtn.addEventListener("click", () => {
        const totalPages = Math.ceil(QUESTIONS.length / PAGE_SIZE);
        if (state.current_page < totalPages - 1) {
          state.current_page++;
          setMessage(quizMessage, "");
          renderPage();
        } else {
          validateAllAndGoComplete();
        }
      });

      downloadBtn.addEventListener("click", downloadJSON);
      restartBtn.addEventListener("click", restart);

      loadState();
      nameInput.value = state.name || "";

      if (state.screen === "quiz" && state.name) {
        showOnly("quiz");
        renderPage();
      } else if (state.screen === "complete" && state.name && getMissingQuestions().length === 0) {
        showOnly("complete");
      } else {
        showOnly("intro");
      }
    })();
  </script>
</body>
</html>
